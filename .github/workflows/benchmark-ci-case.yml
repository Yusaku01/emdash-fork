  test-e2e-table:
    name: Table E2E
    needs: change-plan
    if: needs.change-plan.outputs.e2e_table == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: dependency-cache
        with:
          node-version: 22
          cache: ${{ inputs.cache == 'warm' && 'pnpm' || '' }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm install --frozen-lockfile
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm run --filter "emdash-e2e-fixture..." build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.cache == 'warm'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-browsers-${{ hashFiles('pnpm-lock.yaml') }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm exec playwright install chromium firefox webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # Firefox and WebKit need about 125 MB of system packages that the runner
      # image lacks. Keep the downloaded packages so a slow Ubuntu mirror can't
      # use up the job's time.
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Keep apt package downloads in a cacheable directory
        id: apt-archives
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          printf 'Dir::Cache::Archives "%s/apt-archives";\nAPT::Keep-Downloaded-Packages "true";\nAPT::Sandbox::User "root";\n' "$HOME" |
            sudo tee /etc/apt/apt.conf.d/99playwright-archives
          echo "key=playwright-apt-$ImageOS-$ImageVersion-$(pnpm exec playwright --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.cache == 'warm'
        id: apt-cache
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt-archives.outputs.key }}
          restore-keys: playwright-apt-
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: |
          pnpm exec playwright install-deps chromium firefox webkit
          sudo apt-get autoclean
      # Save right away, so a later test failure or timeout still keeps the packages.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.cache == 'warm' && steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/apt-archives/*.deb
          key: ${{ steps.apt-archives.outputs.key }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm run test:e2e:table
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() || cancelled()
        with:
          name: playwright-table-${{ inputs.case_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
          BROWSER_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-test-e2e-table-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30
