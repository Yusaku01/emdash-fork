  test-hosts:
    name: Host Tests (Node.js ${{ matrix.node }})
    needs: change-plan
    if: needs.change-plan.outputs.hosts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22.16.0, 22, 24.0.0, 24, 26.0.0, 26]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: dependency-cache
        with:
          node-version: ${{ matrix.node }}
          # The floating majors must run the newest release, not the one the
          # runner image caches. Exact versions resolve to themselves.
          check-latest: true
          cache: ${{ inputs.cache == 'warm' && 'pnpm' || '' }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm install --frozen-lockfile
      # The suite's global setup builds every package first.
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm --filter emdash exec vitest run --config vitest.hosts.config.ts

      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-test-hosts-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30

  test-browser:
    name: Browser Tests
    needs: change-plan
    if: needs.change-plan.outputs.browser == 'true' || needs.change-plan.outputs.e2e_playground == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: dependency-cache
        with:
          node-version: 22
          cache: ${{ inputs.cache == 'warm' && 'pnpm' || '' }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm install --frozen-lockfile
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Build selected browser suites
        if: needs.change-plan.outputs.browser == 'true'
        env:
          BROWSER_ADMIN: ${{ needs.change-plan.outputs.browser_admin }}
          BROWSER_EMBEDS: ${{ needs.change-plan.outputs.browser_embeds }}
          BROWSER_RELEASE: ${{ needs.change-plan.outputs.browser_release }}
        run: |
          filters=()
          if [ "$BROWSER_ADMIN" = true ]; then filters+=(--filter "@emdash-cms/admin..."); fi
          if [ "$BROWSER_EMBEDS" = true ]; then filters+=(--filter "@emdash-cms/plugin-embeds..."); fi
          if [ "$BROWSER_RELEASE" = true ]; then filters+=(--filter "@emdash-cms/release-service..."); fi
          if [ "${#filters[@]}" -eq 0 ]; then
            echo "::error::Browser tests were selected without a browser suite"
            exit 1
          fi
          pnpm run --if-present "${filters[@]}" build
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Build playground
        if: needs.change-plan.outputs.e2e_playground == 'true'
        run: pnpm run --filter "@emdash-cms/playground^..." build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.cache == 'warm'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Test release service in Chromium
        if: needs.change-plan.outputs.browser_release == 'true'
        run: pnpm --filter @emdash-cms/release-service test:browser
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Test admin UI
        if: needs.change-plan.outputs.browser_admin == 'true'
        run: pnpm run --filter @emdash-cms/admin test
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Test embeds in Chromium
        if: needs.change-plan.outputs.browser_embeds == 'true'
        run: pnpm --filter @emdash-cms/plugin-embeds test:browser
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Test playground
        if: needs.change-plan.outputs.e2e_playground == 'true'
        run: pnpm run test:e2e:playground
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && needs.change-plan.outputs.e2e_playground == 'true'
        with:
          name: playwright-report-playground-${{ inputs.case_id }}
          path: test-results/
          retention-days: 7

      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
          BROWSER_CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-test-browser-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30

