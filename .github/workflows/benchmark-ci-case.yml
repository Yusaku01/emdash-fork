        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-test-smoke-sites-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30

  test-backend:
    name: Backend Tests
    needs: change-plan
    if: needs.change-plan.outputs.integration == 'true' || needs.change-plan.outputs.d1 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: dependency-cache
        with:
          node-version: 22
          cache: ${{ inputs.cache == 'warm' && 'pnpm' || '' }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm install --frozen-lockfile
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        if: needs.change-plan.outputs.integration == 'true'
        run: pnpm --filter emdash exec vitest run --config vitest.integration.config.ts
      # The suite imports the Cloudflare package, which resolves `emdash`
      # through its published entry points rather than source.
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        if: needs.change-plan.outputs.d1 == 'true'
        run: pnpm run --filter emdash... build
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        if: needs.change-plan.outputs.d1 == 'true'
        run: pnpm --filter emdash exec vitest run --config vitest.workerd.config.ts

      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-test-backend-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
