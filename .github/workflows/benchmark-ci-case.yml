# Generated by scripts/ci-benchmark/generate.mjs from 9b131c37d49e97894937f471b5c8b2ea403576ae.
# Source ci.yml SHA-256: 5bf28cbcfae65ba0ba3b1c7e1a5d967442f2a8fbd331bceabd70299669d41b99.
name: CI benchmark case
on:
  workflow_call:
    inputs:
      case_id:
        type: string
        required: true
      profile:
        type: string
        required: true
      workers:
        type: number
        required: true
      cache:
        type: string
        required: true
permissions:
  contents: read
env:
  CI_BENCH_SOURCE: 9b131c37d49e97894937f471b5c8b2ea403576ae
  CI_BENCH_CASE: ${{ inputs.case_id }}
  CI_BENCH_CACHE: ${{ inputs.cache }}
  CI_BENCH_WORKERS: ${{ inputs.workers }}
jobs:
  change-plan:
    name: Test Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      unit_mode: ${{ steps.plan.outputs.unit_mode }}
      unit_packages: ${{ steps.plan.outputs.unit_packages }}
      smoke: ${{ steps.plan.outputs.smoke }}
      integration: ${{ steps.plan.outputs.integration }}
      d1: ${{ steps.plan.outputs.d1 }}
      hosts: ${{ steps.plan.outputs.hosts }}
      browser: ${{ steps.plan.outputs.browser }}
      browser_admin: ${{ steps.plan.outputs.browser_admin }}
      browser_embeds: ${{ steps.plan.outputs.browser_embeds }}
      browser_release: ${{ steps.plan.outputs.browser_release }}
      e2e_node: ${{ steps.plan.outputs.e2e_node }}
      e2e_cloudflare: ${{ steps.plan.outputs.e2e_cloudflare }}
      e2e_table: ${{ steps.plan.outputs.e2e_table }}
      e2e_playground: ${{ steps.plan.outputs.e2e_playground }}
      full: ${{ steps.plan.outputs.full }}
      design_only: ${{ steps.plan.outputs.design_only }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Test Maintainer review status
        run: node --test .github/scripts/approval.test.mjs
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Select benchmark scenario
        id: plan
        env:
          BENCHMARK_PROFILE: ${{ inputs.profile }}
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" plan >> "$GITHUB_OUTPUT"
      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-change-plan-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30

  typecheck:
    name: Typecheck
    needs: change-plan
    if: needs.change-plan.outputs.design_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: dependency-cache
        with:
          node-version: 22
          cache: ${{ inputs.cache == 'warm' && 'pnpm' || '' }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Check package versions
        run: node .github/scripts/check-no-major.mjs
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm install --frozen-lockfile
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        id: build
        run: pnpm build
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm typecheck
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm run --filter emdash-demo --filter @emdash-cms/demo-cloudflare typecheck
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Template typecheck
        env:
          TEMPLATE_CONCURRENCY: ${{ inputs.workers }}
        run: pnpm run --stream --workspace-concurrency="$TEMPLATE_CONCURRENCY" --filter '{./templates/*}' typecheck
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: node scripts/typecheck-public-source.mjs
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: node scripts/sync-skills-repo.mjs --check
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm run --filter @emdash-cms/release-service --filter @emdash-cms/release-verifier --filter @emdash-cms/release-action typecheck
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm run --filter @emdash-cms/release-service --filter @emdash-cms/release-verifier --filter @emdash-cms/release-action build
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: git diff --exit-code -- apps/release-action/dist/index.js
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm --dir apps/release-service exec wrangler types --check
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm --dir apps/release-verifier exec wrangler types --check
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm --dir apps/release-service exec wrangler deploy --dry-run
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm --dir apps/release-verifier exec wrangler deploy --dry-run
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm lint
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Validate changesets
        run: |
          base=$(git merge-base origin/main HEAD)
          added=$(git diff --name-only --diff-filter=d "$base" -- ':(glob).changeset/*.md' ':(exclude).changeset/README.md')
          if [ -n "$added" ]; then
            pnpm changeset status --since=origin/main
          else
            echo "No changesets added since origin/main; skipping validation."
          fi
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: tsrs shadow typecheck (non-blocking)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/typecheck-tsrs-shadow.mjs
        continue-on-error: true
        timeout-minutes: 5

      # Compatibility checks for the current ruleset. The Typecheck job above now
      # covers these checks; skipped jobs report their legacy contexts without
      # reserving runners. Remove these after the ruleset stops requiring them.
      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-typecheck-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30

  lint:
    name: Lint
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Lint runs in the Typecheck job"

  version-check:
    name: Version Check
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Version validation runs in the Typecheck job"

  test-shards:
    name: Test Shard (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: change-plan
    if: needs.change-plan.outputs.unit_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: emdash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: dependency-cache
        with:
          node-version: 22.16.0
          cache: ${{ inputs.cache == 'warm' && 'pnpm' || '' }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm install --frozen-lockfile
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm run --filter emdash... build
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm --filter emdash exec vitest run --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          EMDASH_TEST_PG: postgres://postgres:test@localhost:5432/emdash_test
      # Render tests use the Astro Vite plugin (vitest.repro.config.ts);
      # they can't run under the plain-node config in test:unit.
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        if: matrix.shardIndex == 1
        run: pnpm --filter emdash exec vitest run --config vitest.repro.config.ts

      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-test-shards-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30

  test-packages-and-fixtures:
    name: Package and Fixture Tests
    needs: change-plan
    if: needs.change-plan.outputs.unit == 'true' || needs.change-plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: dependency-cache
        with:
          node-version: 22.16.0
          cache: ${{ inputs.cache == 'warm' && 'pnpm' || '' }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm install --frozen-lockfile
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Build and test selected packages
        if: needs.change-plan.outputs.unit == 'true'
        env:
          UNIT_PACKAGES: ${{ needs.change-plan.outputs.unit_packages }}
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(node -e 'for (const name of JSON.parse(process.env.UNIT_PACKAGES)) console.log(name)')
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::Unit tests were selected without any packages"
            exit 1
          fi

          build_filters=()
          test_filters=()
          check_registry_verification=false
          for package in "${packages[@]}"; do
            build_filters+=(--filter "${package}...")
            if [ "$package" = "@emdash-cms/registry-verification" ]; then
              check_registry_verification=true
            else
              test_filters+=(--filter "$package")
            fi
          done

          pnpm run --if-present "${build_filters[@]}" build
          if [ "${#test_filters[@]}" -gt 0 ]; then
            pnpm run "${test_filters[@]}" test
          fi
          if [ "$check_registry_verification" = true ]; then
            pnpm --filter @emdash-cms/registry-verification test:package
          fi

      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        name: Test seed fixtures and prerendering
        if: needs.change-plan.outputs.smoke == 'true'
        run: >-
          pnpm --filter emdash exec vitest run
          tests/integration/smoke/template-smoke.test.ts
          tests/integration/smoke/sqlite-prerender.test.ts
          --config vitest.smoke.config.ts

      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-test-packages-and-fixtures-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30

  test:
    name: Tests
    if: always()
    needs:
      [
        change-plan,
        test-shards,
        test-packages-and-fixtures,
        test-smoke-isolated,
        test-smoke-sites,
        test-backend,
        test-hosts,
        test-browser,
        test-e2e-node,
        test-e2e-cloudflare,
        test-e2e-table,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check selected test results
        env:
          PLAN_RESULT: ${{ needs.change-plan.result }}
          CORE_UNIT_SELECTED: ${{ needs.change-plan.outputs.unit_mode == 'full' }}
          CORE_UNIT_RESULT: ${{ needs.test-shards.result }}
          PACKAGE_OR_FIXTURES_SELECTED: ${{ needs.change-plan.outputs.unit == 'true' || needs.change-plan.outputs.smoke == 'true' }}
          PACKAGE_OR_FIXTURES_RESULT: ${{ needs.test-packages-and-fixtures.result }}
          SMOKE_SELECTED: ${{ needs.change-plan.outputs.smoke }}
          SMOKE_ISOLATED_RESULT: ${{ needs.test-smoke-isolated.result }}
          SMOKE_SITES_RESULT: ${{ needs.test-smoke-sites.result }}
          BACKEND_SELECTED: ${{ needs.change-plan.outputs.integration == 'true' || needs.change-plan.outputs.d1 == 'true' }}
          BACKEND_RESULT: ${{ needs.test-backend.result }}
          HOSTS_SELECTED: ${{ needs.change-plan.outputs.hosts }}
          HOSTS_RESULT: ${{ needs.test-hosts.result }}
          BROWSER_SELECTED: ${{ needs.change-plan.outputs.browser == 'true' || needs.change-plan.outputs.e2e_playground == 'true' }}
          BROWSER_RESULT: ${{ needs.test-browser.result }}
          E2E_NODE_SELECTED: ${{ needs.change-plan.outputs.e2e_node }}
          E2E_NODE_RESULT: ${{ needs.test-e2e-node.result }}
          E2E_CLOUDFLARE_SELECTED: ${{ needs.change-plan.outputs.e2e_cloudflare }}
          E2E_CLOUDFLARE_RESULT: ${{ needs.test-e2e-cloudflare.result }}
          TABLE_SELECTED: ${{ needs.change-plan.outputs.e2e_table }}
          TABLE_RESULT: ${{ needs.test-e2e-table.result }}
        run: |
          failed=0
          check_lane() {
            name="$1"
            selected="$2"
            result="$3"
            expected=skipped
            if [ "$selected" = true ]; then expected=success; fi
            if [ "$result" != "$expected" ]; then
              echo "::error::$name was $result; test plan expected $expected"
              failed=1
            fi
          }

          if [ "$PLAN_RESULT" != success ]; then
            echo "::error::Test planning failed or was cancelled"
            failed=1
          fi
          check_lane "Core unit tests" "$CORE_UNIT_SELECTED" "$CORE_UNIT_RESULT"
          check_lane "Package and fixture tests" "$PACKAGE_OR_FIXTURES_SELECTED" "$PACKAGE_OR_FIXTURES_RESULT"
          check_lane "Isolated-install smoke tests" "$SMOKE_SELECTED" "$SMOKE_ISOLATED_RESULT"
          check_lane "Live-site smoke tests" "$SMOKE_SELECTED" "$SMOKE_SITES_RESULT"
          check_lane "Backend tests" "$BACKEND_SELECTED" "$BACKEND_RESULT"
          check_lane "Host tests" "$HOSTS_SELECTED" "$HOSTS_RESULT"
          check_lane "Browser and playground tests" "$BROWSER_SELECTED" "$BROWSER_RESULT"
          check_lane "Node E2E" "$E2E_NODE_SELECTED" "$E2E_NODE_RESULT"
          check_lane "Cloudflare E2E" "$E2E_CLOUDFLARE_SELECTED" "$E2E_CLOUDFLARE_RESULT"
          check_lane "Table E2E" "$TABLE_SELECTED" "$TABLE_RESULT"
          exit "$failed"

  test-smoke-isolated:
    name: Smoke Isolated Install
    needs: change-plan
    if: needs.change-plan.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: emdash-cms/emdash
          ref: 9b131c37d49e97894937f471b5c8b2ea403576ae
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Yusaku01/emdash-fork
          ref: ${{ github.sha }}
          path: .benchmark-harness
          sparse-checkout: scripts/
          persist-credentials: false
      - name: Prepare measurement tools
        shell: bash
        run: mv .benchmark-harness "$GITHUB_WORKSPACE/../ci-benchmark-tools"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        id: dependency-cache
        with:
          node-version: 22
          # The isolated-install test resolves the newest Astro, which can
          # require a newer Node 22 release than the runner image caches.
          check-latest: true
          cache: ${{ inputs.cache == 'warm' && 'pnpm' || '' }}
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: pnpm install --frozen-lockfile
      - shell: node ../ci-benchmark-tools/scripts/ci-benchmark/measure.mjs {0}
        run: >-
          pnpm --filter emdash exec vitest run
          tests/integration/smoke/isolated-install.test.ts
          --config vitest.smoke.config.ts

      - name: Record cache observations
        if: always()
        run: node "$GITHUB_WORKSPACE/../ci-benchmark-tools/scripts/ci-benchmark/run.mjs" context
        env:
          DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: measurement-${{ inputs.case_id }}-test-smoke-isolated-${{ strategy.job-index || 0 }}
          path: ${{ runner.temp }}/ci-measurements/
          retention-days: 30

  test-smoke-sites:
    name: Smoke Tests
