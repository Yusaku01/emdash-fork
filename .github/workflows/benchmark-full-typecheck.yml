name: Full Typecheck Benchmark

on:
  push:
    branches: [feat/benchmark-template-typecheck-concurrency]
    paths:
      - .github/workflows/benchmark-full-typecheck.yml
      - scripts/measure-typecheck-step.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck (${{ matrix.concurrency }} workers, trial ${{ matrix.trial }})
    if: github.repository == 'Yusaku01/emdash-fork'
    strategy:
      fail-fast: false
      matrix:
        concurrency: [1, 2]
        trial: [1, 2, 3]
    defaults:
      run:
        shell: node scripts/measure-typecheck-step.mjs {0}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Check package versions
        run: node .github/scripts/check-no-major.mjs
      - run: pnpm install --frozen-lockfile
      - id: build
        run: pnpm build
      - run: pnpm typecheck
      - run: pnpm run --filter emdash-demo --filter @emdash-cms/demo-cloudflare typecheck
      - name: Template typecheck
        env:
          TEMPLATE_CONCURRENCY: ${{ matrix.concurrency }}
        run: pnpm run --workspace-concurrency="$TEMPLATE_CONCURRENCY" --filter '{./templates/*}' typecheck
      - run: node scripts/typecheck-public-source.mjs
      - run: node scripts/sync-skills-repo.mjs --check
      - run: pnpm run --filter @emdash-cms/release-service --filter @emdash-cms/release-verifier --filter @emdash-cms/release-action typecheck
      - run: pnpm run --filter @emdash-cms/release-service --filter @emdash-cms/release-verifier --filter @emdash-cms/release-action build
      - run: git diff --exit-code -- apps/release-action/dist/index.js
      - run: pnpm --dir apps/release-service exec wrangler types --check
      - run: pnpm --dir apps/release-verifier exec wrangler types --check
      - run: pnpm --dir apps/release-service exec wrangler deploy --dry-run
      - run: pnpm --dir apps/release-verifier exec wrangler deploy --dry-run
      - run: pnpm lint
      - name: Validate changesets
        run: |
          base=$(git merge-base origin/main HEAD)
          added=$(git diff --name-only --diff-filter=d "$base" -- ':(glob).changeset/*.md' ':(exclude).changeset/README.md')
          if [ -n "$added" ]; then
            pnpm changeset status --since=origin/main
          else
            echo "No changesets added since origin/main; skipping validation."
          fi
      - name: tsrs shadow typecheck (non-blocking)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/typecheck-tsrs-shadow.mjs
        continue-on-error: true
        timeout-minutes: 5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: full-typecheck-${{ matrix.concurrency }}-trial-${{ matrix.trial }}
          path: ${{ runner.temp }}/full-typecheck-measurements.jsonl
          retention-days: 7
