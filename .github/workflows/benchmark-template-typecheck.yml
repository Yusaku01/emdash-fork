name: Template Typecheck Benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/benchmark-template-typecheck.yml"
      - "scripts/benchmark-template-typecheck*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    if: github.repository == 'Yusaku01/emdash-fork'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test scripts/benchmark-template-typecheck.test.mjs
      - name: Compare sequential and parallel template typechecks
        run: node scripts/benchmark-template-typecheck.mjs --output "$RUNNER_TEMP/template-typecheck-benchmark"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: template-typecheck-benchmark
          path: ${{ runner.temp }}/template-typecheck-benchmark/
          retention-days: 7
